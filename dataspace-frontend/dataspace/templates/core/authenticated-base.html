{% load static %}

<!DOCTYPE html>
<html lang="en-US" dir="ltr" data-navigation-type="default" data-navbar-horizontal-shape="default">

  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}EnergyGuard{% endblock %}</title>

    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'assets/img/logo/EnergyGuard_logo 32x24.png' %}">

    <!-- Preconnect for Google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <!-- The Google font -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;400;600;700;800;900&amp;display=swap"
        rel="stylesheet">
    <!-- Main CSS - copied verbatim from EnergyGuard-frontend/static/assets/css -->
    <link href="{% static 'assets/css/theme.min.css' %}" type="text/css" rel="stylesheet" id="style-default">
    <link href="{% static 'assets/css/user.min.css' %}" type="text/css" rel="stylesheet" id="user-style-default">
    <meta name="theme-color" content="#ffffff">
    <!-- For Unicons ( <i class="...."></i> ) -->
    <link rel="stylesheet" href="https://unicons.iconscout.com/release/v4.0.8/css/line.css">

    <script src="{% static 'assets/js/config.js' %}"></script>
    {% block head %}
    {% endblock head %}

    <style>
      /* Align Assets dropdown icon with other nav items in collapsed mode */
      .navbar-vertical-collapsed .navbar-vertical .navbar-vertical-content .navbar-nav .nav-link.dropdown-indicator.label-1 {
        padding-left: 1rem !important;
      }
    </style>

  </head>

  <body>

    <main class="main" id="top">

      {% if show_sidebar %}
        {% include "./vertical-navbar.html" %}
      {% endif %}

      {% include "./header.html" %}

      {% block content %}
      {% endblock %}

      <script>
        var navbarTopStyle = window.config.config.phoenixNavbarTopStyle;
        var navbarTop = document.querySelector('.navbar-top');
        if (navbarTopStyle === 'darker') {
          navbarTop.setAttribute('data-navbar-appearance', 'darker');
        }

        var navbarVerticalStyle = window.config.config.phoenixNavbarVerticalStyle;
        var navbarVertical = document.querySelector('.navbar-vertical');
        if (navbarVertical && navbarVerticalStyle === 'darker') {
          navbarVertical.setAttribute('data-navbar-appearance', 'darker');
        }
      </script>

    </main>

    <!-- JavaScripts - copied verbatim from EnergyGuard-frontend/static/vendors -->
    <script src="{% static 'vendors/popper/popper.min.js' %}"></script>
    <script src="{% static 'vendors/bootstrap/bootstrap.min.js' %}"></script>
    <script src="{% static 'vendors/anchorjs/anchor.min.js' %}"></script>
    <script src="{% static 'vendors/is/is.min.js' %}"></script>
    <script src="{% static 'vendors/fontawesome/all.min.js' %}"></script>
    <script src="{% static 'vendors/lodash/lodash.min.js' %}"></script>
    <script src="{% static 'vendors/feather-icons/feather.min.js' %}"></script>
    <script src="{% static 'vendors/dayjs/dayjs.min.js' %}"></script>
    <script src="{% static 'vendors/simplebar/simplebar.min.js' %}"></script>
    <script src="{% static 'assets/js/phoenix.js' %}"></script>
    <script>
    (function () {
      var html = document.documentElement;
      var navbar = document.querySelector('.navbar.navbar-vertical.navbar-expand-lg');
      if (!navbar) return;

      function applyFix() {
        if (html.classList.contains('navbar-vertical-collapsed') && window.innerWidth >= 992) {
          navbar.style.setProperty('position', 'fixed', 'important');
          navbar.style.setProperty('top', 'var(--phoenix-navbar-top-height)', 'important');
          navbar.style.setProperty('height', 'calc(100vh - var(--phoenix-navbar-top-height))', 'important');
          navbar.style.setProperty('padding-top', '0', 'important');
          html.style.minHeight = '';
        } else {
          navbar.style.removeProperty('position');
          navbar.style.removeProperty('top');
          navbar.style.removeProperty('height');
          navbar.style.removeProperty('padding-top');
        }
      }

      applyFix();
      window.addEventListener('resize', applyFix);
      navbar.addEventListener('navbar.vertical.toggle', applyFix);
    })();
    </script>

    <!-- Toast container for our own client-side notifications (login, subscribe, upload, etc.) -->
    <div id="toast-container" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1100; margin-top:70px;"></div>

    {% block scripts %}
    {% endblock scripts %}

  </body>
</html>
